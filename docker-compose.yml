# n8n-Workshop für Dokploy (Compose-Service, Quelle: Git-Repo)
# 9 Gruppen (gtm1..gtm9) + Tools-Instanz. Alle n8n-Container hängen nur am internen
# Netz ohne Internet. Raus geht es ausschließlich über das Gateway (llm-gw) zu OpenRouter.
# Rein kommt man nur über "edge" (nginx), das Traefik von Dokploy bedient.

x-n8n: &n8n
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
  restart: unless-stopped
  mem_limit: ${MEM_LIMIT:-512m}
  networks: [internal]
  entrypoint: ["/bin/sh", "-c"]

x-env: &env
  TZ: ${TZ:-Europe/Berlin}
  GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY fehlt}
  N8N_PROTOCOL: https
  N8N_PROXY_HOPS: "2"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_HIRING_BANNER_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_COMMUNITY_PACKAGES_ENABLED: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "24"
  NODE_OPTIONS: --max-old-space-size=384
  NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]'

# Beim ersten Start einer Gruppen-Instanz: Credential + Starter-Workflows importieren.
# Marker .seeded verhindert, dass ein Neustart Änderungen der Teilnehmer überschreibt.
x-team-command: &team-command
  - |
    if [ ! -f /home/node/.n8n/.seeded ]; then
      sed "s/__TEAM__/$${TEAM}/g" /seed/credentials.tpl.json > /tmp/cred.json
      n8n import:credentials --input=/tmp/cred.json
      if ls /seed/workflows/*.json >/dev/null 2>&1; then
        n8n import:workflow --separate --input=/seed/workflows
      fi
      touch /home/node/.n8n/.seeded
    fi
    exec n8n start

x-tools-command: &tools-command
  - |
    if [ ! -f /home/node/.n8n/.seeded ]; then
      if ls /seed/workflows/*.json >/dev/null 2>&1; then
        n8n import:workflow --separate --input=/seed/workflows
        # Mock-API und MCP-Server müssen aktiv sein (Production-Webhooks)
        for id in $$(n8n list:workflow | sed -n 's/^\([^|]*\)|.*/\1/p'); do
          n8n publish:workflow --id="$$id"
        done
      fi
      touch /home/node/.n8n/.seeded
    fi
    exec n8n start

x-hosts: &hosts "Host(`gtm1.${DOMAIN}`) || Host(`gtm2.${DOMAIN}`) || Host(`gtm3.${DOMAIN}`) || Host(`gtm4.${DOMAIN}`) || Host(`gtm5.${DOMAIN}`) || Host(`gtm6.${DOMAIN}`) || Host(`gtm7.${DOMAIN}`) || Host(`gtm8.${DOMAIN}`) || Host(`gtm9.${DOMAIN}`) || Host(`tools.${DOMAIN}`)"

services:
  # ---------- Eingang: Traefik (Dokploy) -> edge -> n8n je nach Hostname ----------
  edge:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./edge/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal, dokploy-network]
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.n8n-workshop.rule: *hosts
      traefik.http.routers.n8n-workshop.entrypoints: websecure
      traefik.http.routers.n8n-workshop.tls.certresolver: letsencrypt
      traefik.http.routers.n8n-workshop.service: n8n-workshop
      traefik.http.services.n8n-workshop.loadbalancer.server.port: "80"
      traefik.http.routers.n8n-workshop-http.rule: *hosts
      traefik.http.routers.n8n-workshop-http.entrypoints: web
      traefik.http.routers.n8n-workshop-http.middlewares: n8n-workshop-redirect
      traefik.http.routers.n8n-workshop-http.service: n8n-workshop
      traefik.http.middlewares.n8n-workshop-redirect.redirectscheme.scheme: https

  # ---------- Einziger Weg nach draußen: OpenRouter, Key wird hier eingesetzt ----------
  llm-gw:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      OPENROUTER_KEY_1: ${OPENROUTER_KEY_1:?OPENROUTER_KEY_1 fehlt}
      OPENROUTER_KEY_2: ${OPENROUTER_KEY_2:?OPENROUTER_KEY_2 fehlt}
      OPENROUTER_KEY_3: ${OPENROUTER_KEY_3:?OPENROUTER_KEY_3 fehlt}
      OPENROUTER_KEY_4: ${OPENROUTER_KEY_4:?OPENROUTER_KEY_4 fehlt}
      OPENROUTER_KEY_5: ${OPENROUTER_KEY_5:?OPENROUTER_KEY_5 fehlt}
      OPENROUTER_KEY_6: ${OPENROUTER_KEY_6:?OPENROUTER_KEY_6 fehlt}
      OPENROUTER_KEY_7: ${OPENROUTER_KEY_7:?OPENROUTER_KEY_7 fehlt}
      OPENROUTER_KEY_8: ${OPENROUTER_KEY_8:?OPENROUTER_KEY_8 fehlt}
      OPENROUTER_KEY_9: ${OPENROUTER_KEY_9:?OPENROUTER_KEY_9 fehlt}
    volumes:
      - ./llm-gw/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks: [internal, egress]

  # ---------- Owner-Accounts einmalig anlegen (läuft bei jedem Deploy, schadet nicht) ----------
  bootstrap:
    image: curlimages/curl:8.10.1
    restart: "no"
    networks: [internal]
    environment:
      PW_GTM1: ${PW_GTM1:?PW_GTM1 fehlt}
      PW_GTM2: ${PW_GTM2:?PW_GTM2 fehlt}
      PW_GTM3: ${PW_GTM3:?PW_GTM3 fehlt}
      PW_GTM4: ${PW_GTM4:?PW_GTM4 fehlt}
      PW_GTM5: ${PW_GTM5:?PW_GTM5 fehlt}
      PW_GTM6: ${PW_GTM6:?PW_GTM6 fehlt}
      PW_GTM7: ${PW_GTM7:?PW_GTM7 fehlt}
      PW_GTM8: ${PW_GTM8:?PW_GTM8 fehlt}
      PW_GTM9: ${PW_GTM9:?PW_GTM9 fehlt}
      PW_TOOLS: ${PW_TOOLS:?PW_TOOLS fehlt}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        setup() {
          name="$$1"; pw="$$2"; i=0
          until curl -sf "http://$$name:5678/rest/settings" >/dev/null 2>&1; do
            i=$$((i+1))
            if [ "$$i" -gt 90 ]; then echo "$$name: Timeout"; return; fi
            sleep 3
          done
          code=$$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"email\":\"$$name@workshop.example\",\"firstName\":\"Workshop\",\"lastName\":\"$$name\",\"password\":\"$$pw\"}" \
            "http://$$name:5678/rest/owner/setup")
          echo "$$name: owner setup HTTP $$code (200 = angelegt, 400 = schon eingerichtet)"
        }
        setup gtm1 "$$PW_GTM1"
        setup gtm2 "$$PW_GTM2"
        setup gtm3 "$$PW_GTM3"
        setup gtm4 "$$PW_GTM4"
        setup gtm5 "$$PW_GTM5"
        setup gtm6 "$$PW_GTM6"
        setup gtm7 "$$PW_GTM7"
        setup gtm8 "$$PW_GTM8"
        setup gtm9 "$$PW_GTM9"
        setup tools "$$PW_TOOLS"

  # ---------- Gruppen ----------
  gtm1:
    <<: *n8n
    hostname: gtm1
    command: *team-command
    environment:
      <<: *env
      TEAM: gtm1
      N8N_HOST: gtm1.${DOMAIN}
      N8N_EDITOR_BASE_URL: https://gtm1.${DOMAIN}/
      WEBHOOK_URL: https://gtm1.${DOMAIN}/
    volumes:
      - gtm1-data:/home/node/.n8n
      - ./seed/workflows:/seed/workflows:ro
      - ./seed/credentials.tpl.json:/seed/credentials.tpl.json:ro

  gtm2:
    <<: *n8n
    hostname: gtm2
    command: *team-command
    environment:
      <<: *env
      TEAM: gtm2
      N8N_HOST: gtm2.${DOMAIN}
      N8N_EDITOR_BASE_URL: https://gtm2.${DOMAIN}/
      WEBHOOK_URL: https://gtm2.${DOMAIN}/
    volumes:
      - gtm2-data:/home/node/.n8n
      - ./seed/workflows:/seed/workflows:ro
      - ./seed/credentials.tpl.json:/seed/credentials.tpl.json:ro

  gtm3:
    <<: *n8n
    hostname: gtm3
    command: *team-command
    environment:
      <<: *env
      TEAM: gtm3
      N8N_HOST: gtm3.${DOMAIN}
      N8N_EDITOR_BASE_URL: https://gtm3.${DOMAIN}/
      WEBHOOK_URL: https://gtm3.${DOMAIN}/
    volumes:
      - gtm3-data:/home/node/.n8n
      - ./seed/workflows:/seed/workflows:ro
      - ./seed/credentials.tpl.json:/seed/credentials.tpl.json:ro

  gtm4:
    <<: *n8n
    hostname: gtm4
    command: *team-command
    environment:
      <<: *env
      TEAM: gtm4
      N8N_HOST: gtm4.${DOMAIN}
      N8N_EDITOR_BASE_URL: https://gtm4.${DOMAIN}/
      WEBHOOK_URL: https://gtm4.${DOMAIN}/
    volumes:
      - gtm4-data:/home/node/.n8n
      - ./seed/workflows:/seed/workflows:ro
      - ./seed/credentials.tpl.json:/seed/credentials.tpl.json:ro

  gtm5:
    <<: *n8n
    hostname: gtm5
    command: *team-command
    environment:
      <<: *env
      TEAM: gtm5
      N8N_HOST: gtm5.${DOMAIN}
      N8N_EDITOR_BASE_URL: https://gtm5.${DOMAIN}/
      WEBHOOK_URL: https://gtm5.${DOMAIN}/
    volumes:
      - gtm5-data:/home/node/.n8n
      - ./seed/workflows:/seed/workflows:ro
      - ./seed/credentials.tpl.json:/seed/credentials.tpl.json:ro

  gtm6:
    <<: *n8n
    hostname: gtm6
    command: *team-command
    environment:
      <<: *env
      TEAM: gtm6
      N8N_HOST: gtm6.${DOMAIN}
      N8N_EDITOR_BASE_URL: https://gtm6.${DOMAIN}/
      WEBHOOK_URL: https://gtm6.${DOMAIN}/
    volumes:
      - gtm6-data:/home/node/.n8n
      - ./seed/workflows:/seed/workflows:ro
      - ./seed/credentials.tpl.json:/seed/credentials.tpl.json:ro

  gtm7:
    <<: *n8n
    hostname: gtm7
    command: *team-command
    environment:
      <<: *env
      TEAM: gtm7
      N8N_HOST: gtm7.${DOMAIN}
      N8N_EDITOR_BASE_URL: https://gtm7.${DOMAIN}/
      WEBHOOK_URL: https://gtm7.${DOMAIN}/
    volumes:
      - gtm7-data:/home/node/.n8n
      - ./seed/workflows:/seed/workflows:ro
      - ./seed/credentials.tpl.json:/seed/credentials.tpl.json:ro

  gtm8:
    <<: *n8n
    hostname: gtm8
    command: *team-command
    environment:
      <<: *env
      TEAM: gtm8
      N8N_HOST: gtm8.${DOMAIN}
      N8N_EDITOR_BASE_URL: https://gtm8.${DOMAIN}/
      WEBHOOK_URL: https://gtm8.${DOMAIN}/
    volumes:
      - gtm8-data:/home/node/.n8n
      - ./seed/workflows:/seed/workflows:ro
      - ./seed/credentials.tpl.json:/seed/credentials.tpl.json:ro

  gtm9:
    <<: *n8n
    hostname: gtm9
    command: *team-command
    environment:
      <<: *env
      TEAM: gtm9
      N8N_HOST: gtm9.${DOMAIN}
      N8N_EDITOR_BASE_URL: https://gtm9.${DOMAIN}/
      WEBHOOK_URL: https://gtm9.${DOMAIN}/
    volumes:
      - gtm9-data:/home/node/.n8n
      - ./seed/workflows:/seed/workflows:ro
      - ./seed/credentials.tpl.json:/seed/credentials.tpl.json:ro

  # ---------- Tools-Instanz: Mock-API + MCP-Server für die Aufgaben ----------
  tools:
    <<: *n8n
    hostname: tools
    command: *tools-command
    environment:
      <<: *env
      N8N_HOST: tools.${DOMAIN}
      N8N_EDITOR_BASE_URL: https://tools.${DOMAIN}/
      WEBHOOK_URL: https://tools.${DOMAIN}/
    volumes:
      - tools-data:/home/node/.n8n
      - ./seed/tools:/seed/workflows:ro

networks:
  internal:
    internal: true   # kein Internetzugang
  egress: {}
  dokploy-network:
    external: true

volumes:
  gtm1-data:
  gtm2-data:
  gtm3-data:
  gtm4-data:
  gtm5-data:
  gtm6-data:
  gtm7-data:
  gtm8-data:
  gtm9-data:
  tools-data:
