# Verteilt eingehende Anfragen anhand des Hostnamens auf die n8n-Instanzen
# (gtm1.<domain> -> Container gtm1, tools.<domain> -> Container tools)
resolver 127.0.0.11 valid=10s ipv6=off;

# Ausführliches Access-Log (Dokploy -> Service edge -> Logs).
# Felder: Zeit, Client (hinter Traefik: X-Forwarded-For), Host, Instanz, Request, Status,
# Bytes, Dauer gesamt/Upstream, Upstream-Status, WebSocket-Upgrade.
log_format workshop '$time_iso8601 client=$http_x_forwarded_for host=$host team=$team '
                    '"$request" status=$status bytes=$body_bytes_sent rt=$request_time '
                    'urt=$upstream_response_time ust=$upstream_status ws=$http_upgrade ua="$http_user_agent"';
error_log /dev/stderr info;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  access_log /dev/stdout workshop;
  return 404;
}

server {
  listen 80;
  server_name ~^(?<team>gtm[1-9]|tools)\..+$;

  access_log /dev/stdout workshop;
  client_max_body_size 50m;

  location / {
    set $upstream http://$team:5678;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
